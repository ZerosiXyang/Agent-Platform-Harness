name: Agent CI（双核自愈）

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: 后端测试（LangGraph & Memory）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check（强制类型提示 + 禁未使用导入）
        run: |
          ruff check backend
          ruff format --check backend

      - name: Run Backend Tests (LangGraph & Memory)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_test
        run: pytest

  frontend:
    name: 前端 Lint（Vue3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Frontend Lint (Vue3)
        run: cd frontend && npm run lint

  langsmith-check:
    name: LangSmith 打点检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check LangSmith trace_id 打点
        run: |
          # 所有 LangGraph 节点与 @tool 声明必须携带 trace_id / @traceable 打点
          # 若新增节点或工具未打点，此步骤失败拦截
          files=$(grep -rlE "add_node|@tool" backend/ --include='*.py' 2>/dev/null | grep -v '/__init__.py' || true)
          if [ -z "$files" ]; then
            echo "ℹ️ 当前无 LangGraph 节点或 @tool 声明，跳过打点检查"
            exit 0
          fi
          missing=$(echo "$files" | xargs -r grep -LE "trace_id|@traceable" || true)
          if [ -n "$missing" ]; then
            echo "❌ 发现未打点 LangSmith 追踪的代码，请补充 trace_id："
            echo "$missing"
            exit 1
          fi
          echo "✅ 全部已打点 LangSmith 追踪"

  self-heal:
    name: 双核 Agent 自愈
    needs: [backend, frontend, langsmith-check]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Codex CLI
        run: npm install -g @openai/codex

      - name: 配置 Codex 使用 DeepSeek
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          mkdir -p ~/.codex
          {
            echo 'model = "deepseek-v4-flash"'
            echo 'model_provider = "deepseek"'
            echo 'preferred_auth_method = "apikey"'
            echo '[model_providers.deepseek]'
            echo 'name = "deepseek"'
            echo 'base_url = "https://api.deepseek.com/"'
            echo 'wire_api = "responses"'
            echo "experimental_bearer_token = \"$DEEPSEEK_API_KEY\""
          } > ~/.codex/config.toml

      - name: Dual-Core Agent Self-Heal
        run: |
          # Codex 无头模式自愈：读取 CI 失败日志并自动修复
          # 已验证（codex-cli 0.149.1）：prompt 直接作位置参数，沙箱用 -s workspace-write
          # TODO: 接入失败日志获取（如 gh run view --log-failed）后再注入具体报错
          codex exec -s workspace-write \
            "根据 CI 报错修复 Python 或 Vue3 代码，保持架构边界（见 docs/architecture/boundaries.md）。请运行 ruff check 与 npm run lint 定位失败后修复。"

      - name: 推送修复并创建 PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "codex 未产生变更，跳过 PR"
            exit 0
          fi
          BRANCH="auto-heal-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: Codex 自愈修复（run ${{ github.run_id }}）"
          git push origin "$BRANCH"
          gh pr create \
            --title "fix: Codex 自愈修复" \
            --body "CI 失败后由 Codex（DeepSeek）自动修复。触发 run: ${{ github.run_id }}，请人工 review 后合并。" \
            --base main \
            --head "$BRANCH"
