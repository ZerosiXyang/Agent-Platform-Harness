name: Agent CI（双核自愈）

on:
  push:
    branches: [main, develop]   # 承重：不限分支则 feature 直推失败也触发自愈 → heal PR 裹挟 feature 代码
  pull_request:                  # PR 跑门禁做检查；自愈被事件守卫挡掉

jobs:
  backend:
    name: 后端测试（LangGraph & Memory）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      verdict: ${{ steps.gates.outcome }}   # failure=代码问题；skipped=infra 挂在前置步
    steps:
      - uses: actions/checkout@v4           # infra 步
      - uses: actions/setup-python@v5       # infra 步
        with:
          python-version: "3.12"
      - name: Install dependencies          # infra 步：挂 → 后续 gates skipped → verdict=skipped
        run: pip install -e ".[dev]"
      - id: gates                           # 只放代码门禁 + 测试
        name: Gates（Ruff + pytest）
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_test
        run: |
          ruff check backend
          ruff format --check backend
          pytest

  frontend:
    name: 前端 Lint（Vue3）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run Frontend Lint (Vue3)
        run: cd frontend && npm run lint

  langsmith-check:
    name: LangSmith 打点检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check LangSmith trace_id 打点
        run: |
          files=$(grep -rlE "add_node|@tool" backend/ --include='*.py' 2>/dev/null | grep -v '/__init__.py' || true)
          if [ -z "$files" ]; then
            echo "ℹ️ 当前无 LangGraph 节点或 @tool 声明，跳过打点检查"
            exit 0
          fi
          missing=$(echo "$files" | xargs -r grep -LE "trace_id|@traceable" || true)
          if [ -n "$missing" ]; then
            echo "❌ 发现未打点 LangSmith 追踪的代码，请补充 trace_id："
            echo "$missing"
            exit 1
          fi
          echo "✅ 全部已打点 LangSmith 追踪"

  self-heal:
    name: Agent self-heal
    needs: [backend, frontend, langsmith-check]
    timeout-minutes: 20          # 防 agent 挂死烧满小时（限自愈本身）
    # H1 事件守卫：仅 push 事件；PR 不自愈（竞态/裹挟 feature/注入面）。
    #   给 PR 自动修的正确形态是"评论触发+往 head 推回"，不是从 merge ref 开 base=main 新 PR。
    # ⚠ 单行——GHA 表达式不支持 \ 续行（shell 语法；plain scalar 里 \ 是字面字符）。
    # 注意：verdict 判定用 backend（self-heal 修的是 backend 代码）；frontend/langsmith 失败不进入 agent 修复路径。
    if: failure() && needs.backend.outputs.verdict == 'failure' && github.event_name == 'push' && !startsWith(github.head_ref || github.ref_name, 'heal/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: self-heal-${{ github.ref }}
      cancel-in-progress: true     # 只防同 ref 堆积，断环靠上方分支名判定
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps          # 装 dev 依赖锁定 ruff 版本（勿裸装最新，会与 pyproject 锁版本漂移→本地绿 main 红）
        run: pip install -e ".[dev]"
      - name: Install fix agent (pin version)
        run: npm install -g @openai/codex@0.150.1   # 锁版本；换 CLI 见 SKILL 5.0
      - name: Configure fix agent (DeepSeek provider)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          test -f .codex/models.json || { echo "::error::.codex/models.json missing (需进仓库)"; exit 1; }
          mkdir -p ~/.codex
          {
            echo 'model = "deepseek-v4-flash"'
            echo 'model_provider = "deepseek"'
            echo 'preferred_auth_method = "apikey"'
            echo 'model_reasoning_effort = "high"'
            echo "model_catalog_json = \"$GITHUB_WORKSPACE/.codex/models.json\""
            echo '[model_providers.deepseek]'
            echo 'name = "deepseek"'
            echo 'base_url = "https://api.deepseek.com/"'
            echo 'wire_api = "responses"'
            echo "experimental_bearer_token = \"$DEEPSEEK_API_KEY\""
          } > ~/.codex/config.toml
      - name: Self-heal
        run: |
          # 自愈范围 = 门禁范围（含 pytest）——机械快路径复查全门禁，修不掉才调 agent
          python -m ruff check --fix backend 2>/dev/null || true
          python -m ruff format backend 2>/dev/null || true
          if python -m ruff check backend && python -m ruff format --check backend && pytest -q; then
            echo "auto-fix resolved all; skipping agent"
            exit 0
          fi
          codex exec -s danger-full-access \
            "Fix backend/ so 'ruff check backend', 'ruff format --check backend', and 'pytest' all pass. Run them first to locate, fix, then re-run all three to confirm. NEVER delete, skip, or weaken a test to make it pass — fix the code under test instead. If a test is genuinely wrong, leave it failing and say so loudly rather than removing it."
      - name: Verify fix (reject false success)
        run: |
          python -m ruff check backend
          python -m ruff format --check backend
          pytest -q
      - name: Push heal branch + create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "::error::self-heal produced no diff — failure not healed"
            exit 1   # 走到这还没 diff = 自愈失败，必须红（不能绿着 no-op）
          fi
          BRANCH="heal/auto-heal-${{ github.run_id }}"   # heal/ 前缀断环；勿用 fix/（撞车）
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-heal (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          gh pr create --title "fix: auto-heal" \
            --body "CI failure auto-repaired. Trigger run: ${{ github.run_id }}. Please review manually before merge." \
            --base main --head "$BRANCH"
