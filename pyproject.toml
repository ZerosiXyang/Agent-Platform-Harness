[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "企业级全栈 AI 智能体平台 - 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "sqlalchemy>=2.0",
    "pymilvus>=2.4.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.1",
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (含 F401 未使用导入)
    "I",   # isort 导入排序
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "ANN", # flake8-annotations 强制类型提示
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/main.py" = ["ANN001", "ANN201"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
addopts = "--cov=backend --cov-report=term-missing"
